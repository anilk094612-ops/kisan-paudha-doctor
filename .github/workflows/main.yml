name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.PASS123 }}" \
            -keypass "${{ secrets.KEYPASS123 }}" \
            -dname "CN=Kisan Paudha Doctor, OU=App, O=Kisan Paudha Doctor, L=Basti, ST=Uttar Pradesh, C=IN"

      - name: Build AAB
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.PASS123 }}
          KEY_PASSWORD: ${{ secrets.KEYPASS123 }}
        run: gradle bundleRelease

      - name: Find AAB
        run: find . -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisan-paudha-doctor-aab
          path: '**/*.aab'
          if-no-files-found: error
