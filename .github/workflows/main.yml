name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project files
        run: |
          echo "Current folder:"
          pwd
          echo "Files:"
          ls -la
          echo "All Gradle files:"
          find . -maxdepth 3 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \)

      - name: Build AAB
        run: |
          gradle tasks
          gradle bundleRelease

      - name: Find AAB
        run: |
          find . -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisan-paudha-doctor-aab
          path: '**/*.aab'
          if-no-files-found: error
