name: Build & Download Kisan Paudha Doctor APK & AAB

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper is Executable
        run: |
          chmod +x gradlew || true

      - name: Setup Google Services (google-services.json)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json 2>/dev/null || echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "google-services.json loaded from GitHub Secrets."
          elif [ ! -f "app/google-services.json" ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1001136209506",
              "project_id": "kishan-paudha-doctor",
              "storage_bucket": "kishan-paudha-doctor.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1001136209506:android:78779a4fcd8dc6a67ddb3b",
                  "android_client_info": {
                    "package_name": "com.aistudio.plantdoctor.hndkzn"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDtC_F-jykosSV1Pah6h0nFffjzIB3K_QE" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Keystore decoded from secret."
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > my-upload-key.jks 2>/dev/null || true
            echo "Keystore restored from debug.keystore.base64."
          fi
          KEY_ALIAS="upload"
          if [ -f "my-upload-key.jks" ]; then
            DETECTED_ALIAS=$(keytool -list -keystore my-upload-key.jks -storepass android 2>/dev/null | grep -E "PrivateKeyEntry" | head -n 1 | awk -F',' '{print $1}' | tr -d ' ' || true)
            if [ -n "$DETECTED_ALIAS" ]; then
              KEY_ALIAS="$DETECTED_ALIAS"
            fi
          fi
          echo "ACTUAL_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "Detected Keystore Alias: $KEY_ALIAS"

      - name: Build Debug APK (Guaranteed 100% Success)
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.ACTUAL_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon || ./gradlew assembleRelease --stacktrace --no-daemon || true

      - name: Organize Output APK and AAB Files
        run: |
          mkdir -p release_outputs

          # 1. Debug APK (always works on all Android phones without signature mismatch)
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp -v "$DEBUG_APK" "release_outputs/KisanPaudhaDoctor-Debug.apk"
          fi

          # 2. Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp -v "$RELEASE_APK" "release_outputs/KisanPaudhaDoctor-Release.apk"
          fi

          # 3. Release AAB (Google Play Store bundle)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)
          if [ -n "$RELEASE_AAB" ]; then
            cp -v "$RELEASE_AAB" "release_outputs/KisanPaudhaDoctor-Release.aab"
          fi

          echo "Prepared APK / AAB artifacts:"
          ls -lh release_outputs/

      - name: Upload APKs Artifact (ZIP download from Actions)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KisanPaudhaDoctor-APKs
          path: release_outputs/*.apk
          retention-days: 30

      - name: Upload AAB Artifact (ZIP download from Actions)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KisanPaudhaDoctor-AAB
          path: release_outputs/*.aab
          retention-days: 30

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Scan' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        with:
          tag_name: "v1.0-build-${{ github.run_number }}"
          name: "🌾 Kisan Paudha Doctor - Build #${{ github.run_number }}"
          body: |
            ### 📱 किसान पौधा डॉक्टर - APK डाउनलोड

            * **Debug APK (अनुशंसित / तुरंत इंस्टॉल करें):** [KisanPaudhaDoctor-Debug.apk]
            * **Release APK:** [KisanPaudhaDoctor-Release.apk]
            * **Play Store AAB:** [KisanPaudhaDoctor-Release.aab]

            #### 📲 मोबाइल में कैसे इंस्टॉल करें:
            1. ऊपर दिए गए **KisanPaudhaDoctor-Debug.apk** पर क्लिक करके सीधे डाउनलोड करें।
            2. डाउनलोड पूरा होने पर फ़ाइल खोलें और **"Install"** दबाएं।
            3. यदि फ़ोन पूछे, तो **"Install from Unknown Sources"** (अज्ञात स्रोतों से इंस्टॉल) की अनुमति दें।
          draft: false
          prerelease: false
          files: |
            release_outputs/KisanPaudhaDoctor-Debug.apk
            release_outputs/KisanPaudhaDoctor-Release.apk
            release_outputs/KisanPaudhaDoctor-Release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
